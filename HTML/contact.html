<!DOCTYPE html>
<html lang="vi">
    <head>
        <title>Tai Thieu's Personal Website - Contact</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" type="text/css" href="/CSS/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <script src="/JS/script.js"></script>
    </head>
    <body>
        <nav>
            <a href="/HTML/intro.html">Giới thiệu bản thân</a>
            <a href="/HTML/contact.html">Gửi thông tin và giao lưu cùng tôi</a>
        </nav>

        <div id="contact">
            <h1>Gửi thông tin và giao lưu cùng tôi</h1>
            <h2>Thông tin liên hệ</h2>
            <ul>
                <li>Email: 23521378@gm.uit.edu.vn</li>
                <li>Số điện thoại: 0912345678</li>
                <li>Facebook: facebook.com/AmaranthineAngelica</li>
            </ul>
            <h2>Gửi thông tin qua form</h2>
            <form id="contact-form" novalidate>
                <label for="fullname">Họ và tên:</label>
                <input type="text" id="fullname" name="fullname">
                <p class="error-message" id="fullname-error"></p>

                <label for="email">Email:</label>
                <input type="text" id="email" name="email">
                <p class="error-message" id="email-error"></p>

                <label for="message">Nội dung/Góp ý:</label><br>
                <textarea id="message" name="message" rows="4" cols="50"></textarea>
                <p class="error-message" id="message-error"></p>

                <label>Giới tính:</label><br>
                <input type="radio" id="gender-male" name="gender" value="male">
                <label for="gender-male">Nam</label>
                <input type="radio" id="gender-female" name="gender" value="female">
                <label for="gender-female">Nữ</label><br><br>
                
                <button type="submit">Gửi</button>
            </form>
        </div>

        <button id="backToTopBtn" title="Lên đầu trang">
            <i class="fas fa-arrow-up"></i>
        </button>

        <footer>
            <p>@2025 23521378 Thiều Đinh Nam Tài</p>
        </footer>

    </body>
</html>
